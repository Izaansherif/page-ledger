    <!-- Add customer form: simple - just name and phone -->
  <div id="sheet-add-customer" class="sheet" hidden>
    <button id="add-customer-backdrop" class="sheet__backdrop" type="button" aria-label="Close add customer" tabindex="-1"></button>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="add-customer-title" tabindex="-1">
      <div class="sheet__grip" aria-hidden="true"></div>
      <h2 class="sheet__title" id="add-customer-title">Add customer</h2>
      <form id="add-customer-form" class="add-customer-form">
        <div class="field">
          <label for="add-customer-name">Name</label>
          <input id="add-customer-name" type="text" placeholder="Ravi K." autocomplete="off" required />
        </div>
        <div class="field">
          <label for="add-customer-phone">Phone number</label>
          <input id="add-customer-phone" type="tel" placeholder="+91 98765 43210" autocomplete="off" required />
        </div>
        <div class="form-actions">
          <button id="btn-add-customer-cancel" class="btn btn--ghost" type="button">Cancel</button>
          <button id="btn-add-customer-save" class="btn btn--primary btn--block" type="submit">Save customer</button>
        </div>
      </form>
    </div>
  </div>
