# Netlify configuration for Page Ledger
# Same function files that dev-server.js runs locally.

[build]
  # Static site: there is no build step. Naming one explicitly stops Netlify
  # from running a detected/empty script that fails the deploy.
  command = "echo no build step"
  publish = "."
  functions = "netlify/functions"

  # The Meta model id is public documentation (README, docs, recorded
  # fixtures legitimately contain it). The real secret, MODEL_API_KEY, is
  # never in the repo and is still scanned. Netlify otherwise fails the
  # build because SKIM finds MODEL_NAME's value in those public files.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "MODEL_NAME"

# Netlify must bundle the mock fixtures with the functions so AI_MODE=mock
# works in production (demo mode for judges).
[functions]
  included_files = ["fixtures/**"]

[[redirects]]
  from = "/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
