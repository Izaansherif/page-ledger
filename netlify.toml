# Netlify configuration for Page Ledger
# Same function files that dev-server.js runs locally.

[build]
  # Static site: there is no build step. Naming one explicitly stops Netlify
  # from running a detected/empty script that fails the deploy.
  command = "echo no build step"
  publish = "."
  functions = "netlify/functions"

# Netlify must bundle the mock fixtures with the functions so AI_MODE=mock
# works in production (demo mode for judges).
[functions]
  included_files = ["fixtures/**"]

[[redirects]]
  from = "/extract"
  to = "/.netlify/functions/extract"
  status = 200

[[redirects]]
  from = "/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
